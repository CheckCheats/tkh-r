<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="theKing Hub — Roblox 多游戏面板。作者 theKing。">
  <title>theKing Hub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=20260923a">
</head>
<body>
  <div class="rail-track" aria-hidden="true"></div>
  <div class="rail" id="rail" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true">
    <span class="corner tl"><i class="h"></i><i class="v"></i></span>
    <span class="corner tr"><i class="h"></i><i class="v"></i></span>
    <span class="corner bl"><i class="h"></i><i class="v"></i></span>
    <span class="corner br"><i class="h"></i><i class="v"></i></span>
  </div>

  <header class="top">
    <a class="top-mark" href="#top" aria-label="theKing Hub">
      <img src="assets/logo.png" alt="" width="44" height="22">
      <span>theKing Hub</span>
    </a>
    <nav class="top-nav" aria-label="页内">
      <a href="#stats">数据</a>
      <a href="#roster">游戏</a>
    </nav>
    <span class="top-ver">Hub</span>
  </header>

  <main>
    <section class="splash" id="top">
      <div class="splash-inner" id="splash-inner">
        <div class="mark-host" id="mark-host">
          <div class="glow"></div>
          <div class="orbit"></div>
          <img class="logo" src="assets/logo.png" alt="theKing Hub" width="280" height="140">
        </div>
        <h1 class="word">theKing Hub</h1>
        <p class="stage" id="stage" aria-live="polite">读取名单</p>
        <p class="author">作者 <b>theKing</b> · QQ <a href="tencent://message/?uin=416946520">416946520</a></p>
      </div>
      <a class="scroll-cue" href="#roster"><span>在册游戏</span><i></i></a>
    </section>

    <section class="stats" id="stats">
      <article>
        <p class="kicker">Users</p>
        <p class="num" id="user-count">--</p>
        <p class="cap">白名单用户</p>
      </article>
      <article>
        <p class="kicker">Games</p>
        <p class="num" id="game-count">--</p>
        <p class="cap">在册游戏</p>
      </article>
      <article class="injects">
        <p class="kicker">Injects</p>
        <p class="num" id="inject-count">--</p>
        <p class="cap">脚本总注入次数</p>
      </article>
    </section>

    <section class="roster" id="roster">
      <div class="roster-head">
        <p class="kicker">Manifest</p>
        <h2>在册游戏</h2>
        <p class="lead">点一行展开功能简介。图标来自 Roblox，可直接跳进对应游戏。</p>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="foot-brand">
      <img src="assets/logo.png" alt="" width="56" height="28">
      <div>
        <strong>theKing Hub</strong>
        <span>作者 theKing · QQ 416946520</span>
      </div>
    </div>
    <span class="foot-note">进游戏后打开面板。</span>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <button type="button" class="card-head" aria-expanded="false">
        <img class="icon" alt="" width="56" height="56" loading="lazy">
        <span class="meta">
          <span class="names"><b class="cn"></b><em class="en"></em></span>
          <span class="status" title="" aria-label=""></span>
        </span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="card-body" hidden>
        <p class="blurb"></p>
        <ul class="feats"></ul>
        <a class="play" target="_blank" rel="noopener noreferrer">打开 Roblox 游戏</a>
      </div>
    </article>
  </template>

  <script src="js/site.js?v=20260923a"></script>
</body>
</html>
